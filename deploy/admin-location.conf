# public/admin/ — the site's own tools, for whoever runs it.
#
# Included once from the readqurantoday.com vhost (a one-time manual edit, since
# certbot owns that file); synced on every deploy like the other snippets.
#
# ^~ is not decoration: without it /admin/links/links.js matches the site's
# regex location for .js, and that location has no password on it.
location ^~ /admin/ {
    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/snippets/readquran-security.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;

    # GET covers HEAD, which is what the link checker asks with.
    limit_except GET { deny all; }
    limit_req zone=readquran_admin burst=10 nodelay;
    limit_req_status 429;

    # The password file lives on the server only, never in this repo.
    auth_basic "Admin";
    auth_basic_user_file /etc/nginx/readquran-admin.htpasswd;

    try_files $uri $uri/ =404;
}
