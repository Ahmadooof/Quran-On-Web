# Shared security headers.
#
# nginx does not merge add_header down into a location: a single add_header
# inside one throws away every header inherited from the server block. So this
# is included again in each location that sets a header of its own, rather than
# stated once at the top.

add_header X-Content-Type-Options    "nosniff"                         always;
add_header X-Frame-Options           "SAMEORIGIN"                      always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

# Ignored by browsers over plain http, so it is safe to set before TLS is on.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Everything the page needs is same-origin, analytics included — the tracker
# is proxied at /stats.js rather than loaded from a subdomain. script-src has
# no 'unsafe-inline': there are no inline handlers and no inline scripts, and
# the audio host below is named in a meta tag rather than a script for exactly
# that reason. style-src keeps it because jQuery writes element styles as it
# shows and hides panels.
#
# media-src is the one exception to same-origin, and it has to be stated: the
# recitations are more than a gigabyte and are served from R2, and without a
# media-src of its own an <audio> element falls back to default-src and the
# browser refuses the file. Only that one host, and only for media — it can
# carry no script, no style and no frame.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' https://audio.readqurantoday.com; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'; object-src 'none'" always;
