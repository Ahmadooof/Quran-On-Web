# Shared security headers.
#
# nginx does not merge add_header down into a location: a single add_header
# inside one throws away every header inherited from the server block. So this
# is included again in each location that sets a header of its own, rather than
# stated once at the top.

add_header X-Content-Type-Options    "nosniff"                         always;
add_header X-Frame-Options           "SAMEORIGIN"                      always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

# Ignored by browsers over plain http, so it is safe to set before TLS is on.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Everything the page needs is same-origin bar the analytics host, which is
# named explicitly rather than opened up with a wildcard. script-src has no
# 'unsafe-inline': there are no inline handlers and no inline scripts.
# style-src keeps it because jQuery writes element styles as it shows and
# hides panels.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://analytics.readqurantoday.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://analytics.readqurantoday.com; base-uri 'self'; form-action 'none'; frame-ancestors 'self'; object-src 'none'" always;
