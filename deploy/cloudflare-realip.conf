# Who the visitor actually is, when Cloudflare is in front.
#
# analytics.readqurantoday.com is proxied, so every request reaches nginx from
# a Cloudflare edge server: $remote_addr is 104.x or 172.x, never the reader's
# address. That broke the dashboard's allow list quietly and completely -- the
# one address it lets in was an address nginx could not see, so it refused
# everyone, including the person the list was written for.
#
# set_real_ip_from names the peers whose CF-Connecting-IP header may be
# believed. That is the whole of the security here: the header is honoured only
# when the connection itself comes from one of these ranges, so a request sent
# straight to the origin with a forged header is not trusted -- it is judged on
# the address it really came from, and refused. Cloudflare overwrites
# CF-Connecting-IP on the way through, so a forged one cannot ride in either.
#
# It also fixes the analytics themselves: X-Real-IP is passed upstream to
# Umami, which until now recorded a Cloudflare data centre as the visitor's
# location on every single event.
#
# Cloudflare's published ranges, from <https://www.cloudflare.com/ips-v4> and
# <https://www.cloudflare.com/ips-v6>. They change rarely; refresh from those
# two urls when they do.

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
