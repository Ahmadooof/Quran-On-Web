# analytics.readqurantoday.com — Umami.
#
# The only host in this setup that fronts a process rather than files. Umami
# listens on 127.0.0.1:3000 from Docker and is never exposed directly.
#
# `certbot --nginx` adds the TLS listeners and the http->https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name analytics.readqurantoday.com;

    # The dashboard is for you, not for readers; keep it out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
