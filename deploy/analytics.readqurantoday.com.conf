# analytics.readqurantoday.com — Umami.
#
# The only host in this setup that fronts a process rather than files. Umami
# listens on 127.0.0.1:3000 from Docker and is never exposed directly.
#
# `certbot --nginx` adds the TLS listeners and the http->https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name analytics.readqurantoday.com;

    # The dashboard is for you, not for readers; keep it out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Every reader's browser fetches the tracker from here and posts its events
    # back to it, so these two have to stay open to the whole internet. Lock
    # them down with the dashboard and analytics quietly stops collecting.
    location = /script.js {
        proxy_pass http://127.0.0.1:3000/script.js;
        include /etc/nginx/snippets/umami-proxy.conf;
    }

    location = /api/send {
        proxy_pass http://127.0.0.1:3000/api/send;
        include /etc/nginx/snippets/umami-proxy.conf;
    }

    # Signing in is the one door worth slowing down now that nothing stands in
    # front of it. Umami's own login is the path; everything else the dashboard
    # asks for is already behind a session.
    location = /api/auth/login {
        limit_req zone=readquran_umami burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000/api/auth/login;
        include /etc/nginx/snippets/umami-proxy.conf;
    }

    # Everything else is the dashboard and its API, open to the internet and
    # held by the password plus a second factor — see DEPLOY.md section 6a.
    #
    # An address allow-list stood here until then. It kept strangers out and
    # kept you out from everywhere but home -- and it only ever listed IPv4, so
    # a browser reaching this host over IPv6 was refused by a rule that looked
    # right. The second factor is the stronger half of that trade, and needs
    # no script following your address around.
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/umami-proxy.conf;
    }
}
