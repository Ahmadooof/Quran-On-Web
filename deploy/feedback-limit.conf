# Rate limit for the app's feedback endpoint. http-level, so installed to
# /etc/nginx/conf.d/ by sync-nginx.sh; the location that uses it is feedback-location.conf.
#
# Keyed on the visitor's address. The location restores it from Cloudflare first,
# and nginx runs realip before limit_req, so this is the reader, not the edge.
limit_req_zone $binary_remote_addr zone=readquran_feedback:1m rate=6r/m;

# The reports page is behind a password; this slows anyone guessing it.
limit_req_zone $binary_remote_addr zone=readquran_feedback_admin:1m rate=20r/m;
