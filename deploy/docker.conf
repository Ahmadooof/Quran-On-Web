# The reader inside a container: files off disk, nothing else.
#
# The site's own vhost (readqurantoday.com.conf) is the same idea with TLS, the
# analytics proxy, the feedback service and the admin pages on top. None of
# those belong in a copy someone else runs, so this is the caching and the
# headers and no more.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Arabic text and JSON compress hard; woff2 is already compressed, and
    # squeezing it again only burns CPU.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/css text/plain application/javascript application/json
               image/svg+xml application/manifest+json;

    include /etc/nginx/snippets/readquran-security.conf;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Each mushaf page is its own font file and never changes once built.
    location /fonts/ {
        include /etc/nginx/snippets/readquran-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        gzip off;
        access_log off;
        try_files $uri =404;
    }

    location /data/ {
        include /etc/nginx/snippets/readquran-security.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        include /etc/nginx/snippets/readquran-security.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # nginx's mime.types has no entry for .webmanifest, so it would go out as
    # application/octet-stream and the browser would ignore it.
    location = /site.webmanifest {
        include /etc/nginx/snippets/readquran-security.conf;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # A directory request arrives here as its index.html, so this covers the
    # front page and all 228 generated pages alike.
    location ~ /index\.html$ {
        include /etc/nginx/snippets/readquran-security.conf;
        add_header Cache-Control "no-cache" always;
    }

    # There is no analytics in a copy someone else runs. Answer with nothing
    # rather than an html 404 the browser would refuse as a script.
    location = /stats.js {
        default_type application/javascript;
        return 200 "/* no analytics in this copy */";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
