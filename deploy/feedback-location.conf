# The Android app's feedback, and the page to read it.
#
# Included once from the readqurantoday.com vhost (a one-time manual edit, since
# certbot owns that file); synced on every deploy like the other snippets.

# Reports from the app: open to everyone, checked and rate limited.
location = /api/feedback {
    include /etc/nginx/snippets/cloudflare-realip.conf;

    limit_except POST { deny all; }

    limit_req zone=readquran_feedback burst=3 nodelay;
    limit_req_status 429;

    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_body_timeout 10s;

    proxy_http_version 1.1;
    proxy_set_header Host      $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_pass http://127.0.0.1:8787;

    access_log off;
}

# Reading them from anywhere: a password over HTTPS, so it works from a phone on
# mobile data. The password file lives on the server only, never in this repo.
location = /feedback/reports {
    return 301 /feedback/reports/;
}

# The page itself: static files from the checkout. ^~ so the site's regex
# locations for .js, .css and index.html do not take these requests instead.
location ^~ /feedback/reports/ {
    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/snippets/readquran-security.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;

    limit_except GET { deny all; }
    limit_req zone=readquran_feedback_admin burst=10 nodelay;
    limit_req_status 429;

    auth_basic "Feedback";
    auth_basic_user_file /etc/nginx/readquran-feedback.htpasswd;

    alias /var/www/readqurantoday/feedback/admin/;
    index index.html;
}

# The reports the page loads, from the service.
location = /feedback/api/reports {
    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/snippets/readquran-security.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;

    limit_except GET { deny all; }
    limit_req zone=readquran_feedback_admin burst=10 nodelay;
    limit_req_status 429;

    auth_basic "Feedback";
    auth_basic_user_file /etc/nginx/readquran-feedback.htpasswd;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_pass http://127.0.0.1:8787/admin/reports$is_args$args;
}
