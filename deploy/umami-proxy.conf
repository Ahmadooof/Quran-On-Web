# Headers for anything passed through to Umami.
#
# Headers only, no proxy_pass: each location names its own upstream path, so
# the tracker can be served from this domain at /stats.js while the dashboard
# is served from the analytics subdomain at /.

# Rewrite $remote_addr from CF-Connecting-IP first, so everything below --
# and the dashboard's allow list, which is checked before any of this -- sees
# the visitor rather than the Cloudflare edge that carried them. Included from
# here rather than from the vhost because the vhosts are certbot's and are
# never overwritten by a deploy, while this snippet is.
include /etc/nginx/snippets/cloudflare-realip.conf;

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "upgrade";
