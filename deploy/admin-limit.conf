# Rate limit for the admin pages. http-level, so installed to /etc/nginx/conf.d/
# by sync-nginx.sh; the location that uses it is admin-location.conf.
#
# The page is behind a password; this slows anyone guessing it.
limit_req_zone $binary_remote_addr zone=readquran_admin:1m rate=20r/m;

# The analytics dashboard's login, which lost its address allow-list when Umami
# grew a second factor. Used by analytics.readqurantoday.com.conf.
limit_req_zone $binary_remote_addr zone=readquran_umami:1m rate=10r/m;
