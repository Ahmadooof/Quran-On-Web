<!doctype html>
<meta charset=utf-8>
<title>QCF check — teaching a model to see the marks</title>
<link rel=stylesheet href=/static/style.css>

<div class=frame>

<!-- The rail is for getting about, and for the controls of the two views
     whose content is a tall page that wants the window's whole height. Every
     other view's controls sit across the top of its own area instead: a list
     or a grid scrolls anyway, and putting its settings in a narrow column
     leaves the column crammed and the middle of the screen empty. -->
<nav class=rail>
  <div class=brand>QCF check</div>

  <div class=tabs>
    <button class="tab on" data-v=labels>Labels</button>
    <button class=tab data-v=train>Train</button>
    <button class=tab data-v=models>Models</button>
    <button class=tab data-v=compare>Compare</button>
    <button class=tab data-v=finetune>Fine-tune</button>
  </div>

  <div id=railslot></div>
  <div class=state id=state></div>
</nav>

<main class=stagearea>
  <header class=viewhead>
    <div class=viewtitle>
      <h1 id=title></h1>
      <p class=sub id=sub></p>
    </div>
    <div id=topslot></div>
  </header>

  <div class=views>
    <div id=labels></div>
    <div id=train hidden>
      <div class=form id=t-fresh>
        <section class=group>
          <h3>How long</h3>
          <label class=full>steps
            <input id=tsteps type=number value=900 min=100 max=4000 step=100></label>
          <label class=full>crops per step
            <input id=tbatch type=number value=16 min=2 max=64 step=2></label>
        </section>

        <section class=group>
          <h3>How much to shake each word</h3>
          <label class=full>scale, give or take
            <input id=tscale type=number value=0.15 min=0 max=0.5 step=0.05></label>
          <label class=full>rotation, degrees
            <input id=trot type=number value=3 min=0 max=15 step=1></label>
          <label class=full>ink spread, how often
            <input id=tspread type=number value=0.4 min=0 max=1 step=0.1></label>
        </section>

        <section class=group>
          <h3>The learning itself</h3>
          <label class=full>learning rate
            <input id=tlr type=number value=0.002 min=0.00001 max=0.1 step=0.0005></label>
          <label class=full>width — channels in the first layer
            <input id=twidth type=number value=16 min=8 max=32 step=4></label>
          <label class=full>weight decay
            <input id=tdecay type=number value=0.0001 min=0 max=0.1 step=0.0001></label>
          <label class=full>seed
            <input id=tseed type=number value=0 min=0 max=9999></label>
          <label class=full>hold out, share of words kept back
            <input id=tholdout type=number value=0 min=0 max=0.5 step=0.05></label>
        </section>
      </div>

      <div class=form id=t-tune hidden>
        <section class=group>
          <h3>Which model, and for how long</h3>
          <label class=full>start from <select id=fbase></select></label>
          <label class=full>steps
            <input id=fsteps type=number value=300 min=20 max=5000 step=50></label>
          <label class=full>crops per step
            <input id=fbatch type=number value=16 min=2 max=64 step=2></label>
        </section>

        <section class=group>
          <h3>How much of it is real</h3>
          <label class=full>real share of each batch
            <input id=fshare type=number value=0.7 min=0.1 max=0.9 step=0.1></label>
          <label class=full>rotation, degrees
            <input id=frot type=number value=2 min=0 max=10 step=0.5></label>
          <label class=full>scale, give or take
            <input id=fscale type=number value=0.05 min=0 max=0.3 step=0.05></label>
        </section>

        <section class=group>
          <h3>The learning itself</h3>
          <label class=full>learning rate
            <input id=flr type=number value=0.00001 min=0.0000001 max=0.001 step=0.000005></label>
          <label class=full>seed
            <input id=fseed type=number value=0 min=0 max=9999></label>
          <label class=pick><input id=ffreeze type=checkbox checked>
            keep the normalisation as it was learned</label>
        </section>
      </div>

      <div id=tout></div>
    </div>
    <div id=models hidden></div>
    <div id=compare hidden></div>
    <div id=finetune hidden></div>
  </div>
</main>

</div>

<!-- Every view's controls live here and are moved into whichever slot suits
     them. One copy of each, wherever it ends up on screen. -->
<div id=bars hidden>

  <div class="bar side" id=bar-finetune>
    <label class=full>photograph <select id=ff></select></label>
    <label class=full>detail, longest side
      <input id=fdetail type=number value=5200 min=1200 max=9000 step=400></label>
    <div class=row>
      <button id=fprev class=quiet title="the line above">&uarr;</button>
      <label>line <input id=fline type=number value=0 min=0></label>
      <button id=fnext class=quiet title="the line below">&darr;</button>
    </div>
    <label class=full>proposed by <select id=fm></select></label>
    <div class=row>
      <button id=fgo>Show this line</button>
      <button id=frank class=quiet title="the lines this model is least sure of, first">Rank</button>
    </div>
    <div id=franks></div>
    <div class=key id=fkey></div>
    <div id=fbox></div>
    <span id=fst class=note></span>
  </div>

  <!-- top bars: a row of controls above content that scrolls ------------- -->

  <!-- Labelling has one home. A page of cards and a whole page are two ways
       of looking at the same labels, and correcting a model's reading of a
       page is a third -- they were two tabs because they were written at
       different times, not because they are different jobs. -->
  <div class="bar" id=bar-labels>
    <select id=lwhat>
      <option value=page>whole page</option>
      <option value=table>table</option>
      <option value=type>cards</option>
      <option value=real>photo lines</option>
    </select>

    <!-- Two pickers, one shown at a time. A list can only offer pages that
         have labels on them; the page view has to reach any of the 604, and
         above all the ones with nothing on them yet -- those are where the
         labelling starts, and building the picker out of labelled pages made
         them the only pages unreachable. -->
    <label id=lnumwrap>page
      <button id=lprev class=quiet title="the page before">&larr;</button>
      <input id=lpagenum type=number value=1 min=1 max=604>
      <button id=lnext class=quiet title="the page after">&rarr;</button></label>
    <label id=lpagewrap>page <select id=lpage></select></label>

    <button id=lgo>Show</button>
    <button id=lbest class=quiet hidden></button>

    <label id=loddwrap class=pick><input id=lodd type=checkbox> mismatches only</label>
    <button id=lall class=quiet>Select all</button>
    <button id=ldel class=quiet disabled>Delete</button>
    <label id=lharvestwrap class=pick title="a word whose mark count matches its Uthmani spelling is corroborated by something outside the model"><input id=rharvest type=checkbox checked>
      keep agreeing words</label>

    <span id=lcolours class=row>
      <label class=pick>ink <input id=cink type=color value="#1e1e1e"></label>
      <label class=pick>marks <input id=cmark type=color value="#e62828"></label>
    </span>
    <div class=key id=key></div>
    <div id=pagebox></div>
    <span id=lst class=note></span>
  </div>

  <div class="bar top" id=bar-train>
    <select id=tmode>
      <option value=fresh>from nothing, on the labelled words</option>
      <option value=tune>fine-tune a model on confirmed photo lines</option>
    </select>
    <button id=tgo>Train</button>
    <span id=tplan class=note></span>

    <span class=break></span>

    <label>or search
      <select id=takind>
        <option value=digital>digital</option>
        <option value=physical>physical</option>
      </select></label>
    <label>rounds <input id=tarounds type=number value=8 min=1 max=40></label>
    <label>stop after <input id=tapat type=number value=4 min=1 max=20></label>
    <button id=tauto class=quiet title="vary the best model's settings, keep whatever beats it">Auto-train</button>
    <span id=tst class=note></span>
  </div>

  <div class="bar top" id=bar-models>
    <span id=mst class=note></span>
  </div>

  <div class="bar top" id=bar-compare>
    <label>on <select id=cwhat>
        <option value=type>a digital page</option>
        <option value=photo>a photograph</option>
        <option value=both>both</option>
      </select></label>

    <span id=c-type class=row>
      <label>pages <input id=cf type=number value=200 min=1 max=604></label>
      <label>to <input id=ct type=number value=200 min=1 max=604></label>
      <label class=pick><input id=conly type=checkbox> ring differences</label>
    </span>

    <span id=c-photo class=row hidden>
      <label>photo <select id=cpf></select></label>
      <label>detail <input id=cpdetail type=number value=5200 min=1200 max=9000 step=400></label>
    </span>

    <span class=break></span>

    <label>models</label>
    <span class=models-pick id=cpick></span>
    <button id=cgo>Compare</button>
    <span id=cst class=note></span>
  </div>

<script src=/static/app.js></script>
