<!doctype html>
<meta charset=utf-8>
<title>QCF check — teaching a model to see the marks</title>
<link rel=stylesheet href=/static/style.css>

<div class=frame>

<!-- The rail is for getting about, and for the controls of the two views
     whose content is a tall page that wants the window's whole height. Every
     other view's controls sit across the top of its own area instead: a list
     or a grid scrolls anyway, and putting its settings in a narrow column
     leaves the column crammed and the middle of the screen empty. -->
<nav class=rail>
  <div class=brand>QCF check</div>

  <div class=tabs>
    <button class="tab on" data-v=review>Read &amp; correct</button>
    <button class=tab data-v=labels>Labels</button>
    <button class=tab data-v=train>Train</button>
    <button class=tab data-v=models>Models</button>
    <button class=tab data-v=compare>Compare</button>
    <button class=tab data-v=finetune>Fine-tune</button>
  </div>

  <div id=railslot></div>
  <div class=state id=state></div>
</nav>

<main class=stagearea>
  <header class=viewhead>
    <div class=viewtitle>
      <h1 id=title></h1>
      <p class=sub id=sub></p>
    </div>
    <div id=topslot></div>
  </header>

  <div class=views>
    <div id=review></div>
    <div id=labels hidden></div>
    <div id=train hidden></div>
    <div id=models hidden></div>
    <div id=compare hidden></div>
    <div id=finetune hidden></div>
  </div>
</main>

</div>

<!-- Every view's controls live here and are moved into whichever slot suits
     them. One copy of each, wherever it ends up on screen. -->
<div id=bars hidden>

  <div class="bar side" id=bar-review>
    <div class=row>
      <button id=rprev class=quiet title="the page before">&larr;</button>
      <label>page <input id=rf type=number value=3 min=1 max=604></label>
      <button id=rnext class=quiet title="the page after">&rarr;</button>
    </div>
    <label class=full>model <select id=rm></select></label>
    <button id=rgo>Evaluate with the model</button>
    <button id=rplain class=quiet>Just the type</button>
    <div class=row>
      <label class=pick>ink <input id=cink type=color value="#1e1e1e"></label>
      <label class=pick>marks <input id=cmark type=color value="#e62828"></label>
    </div>
    <div class=key id=key></div>
    <div id=pagebox></div>
    <span id=rst class=note></span>
  </div>

  <div class="bar side" id=bar-finetune>
    <label class=full>photograph <select id=ff></select></label>
    <label class=full>detail, longest side
      <input id=fdetail type=number value=5200 min=1200 max=9000 step=400></label>
    <div class=row>
      <button id=fprev class=quiet title="the line above">&uarr;</button>
      <label>line <input id=fline type=number value=0 min=0></label>
      <button id=fnext class=quiet title="the line below">&darr;</button>
    </div>
    <label class=full>proposed by <select id=fm></select></label>
    <div class=row>
      <button id=fgo>Show this line</button>
      <button id=frank class=quiet title="the lines this model is least sure of, first">Rank</button>
    </div>
    <div id=franks></div>
    <div class=key id=fkey></div>
    <div id=fbox></div>
    <span id=fst class=note></span>
  </div>

  <!-- top bars: a row of controls above content that scrolls ------------- -->

  <div class="bar top" id=bar-labels>
    <label>show
      <select id=lwhat>
        <option value=type>words of type</option>
        <option value=real>lines of a photograph</option>
      </select></label>
    <label id=lpagewrap>page <input id=lpage type=number placeholder=all min=1 max=604></label>
    <label id=loddwrap class=pick><input id=lodd type=checkbox>
      only where the count disagrees with the spelling</label>
    <button id=lgo>Show them</button>
    <button id=ldel class=quiet disabled>Delete ticked</button>
    <span id=lst class=note></span>
  </div>

  <!-- Both ways of making a model live here, because both are training and
       splitting them put half the controls in another tab's sidebar. From
       nothing teaches the shape of a mark from unlimited synthetic variations
       on the hand labels; fine-tuning nudges one of those onto a few real
       photographed lines without letting it forget the type. -->
  <div class="bar top" id=bar-train>
    <label>train
      <select id=tmode>
        <option value=fresh>from nothing, on the labelled words</option>
        <option value=tune>by fine-tuning a model on confirmed real lines</option>
      </select></label>

    <span id=t-fresh>
      <label>steps <input id=tsteps type=number value=900 min=100 max=4000 step=100></label>
      <label>scale ± <input id=tscale type=number value=0.15 min=0 max=0.5 step=0.05></label>
      <label>rotate ° <input id=trot type=number value=3 min=0 max=15 step=1></label>
      <label>ink spread <input id=tspread type=number value=0.4 min=0 max=1 step=0.1></label>
      <label>batch <input id=tbatch type=number value=16 min=2 max=64 step=2></label>
      <label>rate <input id=tlr type=number value=0.002 min=0.00001 max=0.1 step=0.0005></label>
      <label>width <input id=twidth type=number value=16 min=8 max=32 step=4></label>
      <label>decay <input id=tdecay type=number value=0.0001 min=0 max=0.1 step=0.0001></label>
      <label>seed <input id=tseed type=number value=0 min=0 max=9999></label>
      <label>hold out <input id=tholdout type=number value=0 min=0 max=0.5 step=0.05></label>
    </span>

    <span id=t-tune hidden>
      <label>from <select id=fbase></select></label>
      <label>steps <input id=fsteps type=number value=300 min=20 max=5000 step=50></label>
      <label>rate <input id=flr type=number value=0.00001 min=0.0000001 max=0.001 step=0.000005></label>
      <label>real share <input id=fshare type=number value=0.7 min=0.1 max=0.9 step=0.1></label>
      <label>batch <input id=fbatch type=number value=16 min=2 max=64 step=2></label>
      <label>rotate ° <input id=frot type=number value=2 min=0 max=10 step=0.5></label>
      <label>scale ± <input id=fscale type=number value=0.05 min=0 max=0.3 step=0.05></label>
      <label>seed <input id=fseed type=number value=0 min=0 max=9999></label>
      <label class=pick><input id=ffreeze type=checkbox checked> freeze the normalisation</label>
    </span>

    <button id=tgo>Train a new model</button>
    <span id=tplan class=note></span>
    <span id=tst class=note></span>
  </div>

  <div class="bar top" id=bar-models>
    <button id=mgo>Show the models</button>
    <label>test <select id=mm></select></label>
    <label>on page <input id=mpage type=number value=200 min=1 max=604></label>
    <button id=mtest class=quiet>Test on type</button>
    <label>or <select id=mpf></select></label>
    <button id=mtestp class=quiet>Test on the confirmed lines</button>
    <span id=mst class=note></span>
  </div>

  <div class="bar top" id=bar-compare>
    <label>on
      <select id=cwhat>
        <option value=type>a page of type</option>
        <option value=photo>a photograph</option>
      </select></label>

    <span id=c-type>
      <label>page <input id=cf type=number value=200 min=1 max=604></label>
      <label>to <input id=ct type=number value=200 min=1 max=604></label>
      <label class=pick><input id=conly type=checkbox> ring the words they read differently</label>
    </span>

    <span id=c-photo hidden>
      <label>photograph <select id=cpf></select></label>
      <label>detail <input id=cpdetail type=number value=5200 min=1200 max=9000 step=400></label>
    </span>

    <span class=models-pick id=cpick></span>
    <button id=cgo>Read it</button>
    <span id=cst class=note></span>
  </div>
</div>

<script src=/static/app.js></script>
