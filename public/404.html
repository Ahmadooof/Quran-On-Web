<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>الصفحة غير موجودة | Page not found</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --ground: #fffdf7; --text: #16283a; --mute: #6a869b; --accent: #1a6fa3; }
    @media (prefers-color-scheme: dark) {
      :root { --ground: #1a1f25; --text: #d7dce1; --mute: #8b939c; --accent: #3f9bd1; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ground); color: var(--text); font: 16px/1.75 system-ui, "Segoe UI", Tahoma, sans-serif; text-align: center; }
    main { padding: 24px 16px; }
    img { width: 96px; height: 96px; }
    h1 { font-size: 1.4rem; margin: 12px 0 4px; }
    p { margin: 4px 0; color: var(--mute); }
    a { color: var(--accent); font-weight: 600; }
  </style>
</head>

  <main>
    <img src="/favicon.svg" alt="" width="96" height="96" />
    <h1>الصفحة غير موجودة</h1>
