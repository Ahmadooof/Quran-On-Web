<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Links · The Great Quran</title>
<link rel="stylesheet" href="../admin.css" />
<link rel="stylesheet" href="links.css" />
</head>
<body>
<main>
  <p class="crumb"><a href="../">Admin</a> / Links</p>

  <header class="top">
    <h1>Links</h1>
    <button id="check" type="button">Check all</button>
  </header>

  <p id="status" class="status" role="status">Reading the sitemap…</p>

  <section class="tally">
    <div class="fig"><b id="t-all">–</b><span>in the sitemap</span></div>
    <div class="fig"><b id="t-done">–</b><span>checked</span></div>
    <div class="fig ok"><b id="t-ok">–</b><span>accessible</span></div>
    <div class="fig bad"><b id="t-bad">–</b><span>not accessible</span></div>
  </section>

  <nav class="filters">
    <div class="tabs" id="tabs" role="tablist"></div>
    <input id="find" type="search" placeholder="Filter by path" aria-label="Filter by path" />
    <label class="only"><input id="only" type="checkbox" /> Problems only</label>
  </nav>

  <table class="links">
    <thead>
      <tr>
        <th class="c-url">Link</th>
        <th class="c-kind">Kind</th>
        <th class="c-open">Accessible</th>
        <th class="c-code">Status</th>
        <th class="c-ms">Time</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <p class="none" id="none" hidden>Nothing matches that.</p>
  <p class="more"><button id="more" type="button" hidden></button></p>
</main>

<template id="row">
  <tr>
    <td class="c-url"><a target="_blank" rel="noopener"></a></td>
    <td class="c-kind"></td>
    <td class="c-open">–</td>
    <td class="c-code">–</td>
    <td class="c-ms"></td>
  </tr>
</template>

<script src="links.js"></script>
</body>
</html>
